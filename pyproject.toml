[project]
name = "dnspython"
version = "0.1.0"
description = "DNS server with utility tools including time conversion"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["dnslib", "requests"]

[project.scripts]
dnspython = "utils.main:main"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
